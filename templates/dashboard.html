<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Electoral</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
    <div class="container mt-4">
        <h2 class="text-center">📊 Monitor Geográfico en Vivo</h2>
        <div class="row mt-4">
            <div class="col-md-6"><canvas id="cPresi" class="bg-white p-2"></canvas></div>
            <div class="col-md-6"><canvas id="cGober" class="bg-white p-2"></canvas></div>
        </div>
        <div class="card mt-4 p-3 text-dark">
            <h4>📍 Liderazgo por Provincia (Presidente)</h4>
            <table class="table">
                <thead><tr><th>Provincia</th><th>Partido A</th><th>Partido B</th></tr></thead>
                <tbody id="tBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const ctxP = document.getElementById('cPresi').getContext('2d');
        const ctxG = document.getElementById('cGober').getContext('2d');
        const chartP = new Chart(ctxP, { type: 'bar', data: { labels: ['A', 'B'], datasets: [{ data: [0,0], backgroundColor: '#36a2eb' }] }, options: { plugins: { title: { display: true, text: 'Presidente' } } } });
        const chartG = new Chart(ctxG, { type: 'bar', data: { labels: ['X', 'Y'], datasets: [{ data: [0,0], backgroundColor: '#ff9f40' }] }, options: { plugins: { title: { display: true, text: 'Gobernador' } } } });

        async function update() {
            const res = await fetch('/api/resultados_completos');
            const d = await res.json();
            
            chartP.data.datasets[0].data = [d.presidente.A, d.presidente.B];
            chartG.data.datasets[0].data = [d.gobernador.X, d.gobernador.Y];
            chartP.update(); chartG.update();

            let html = '';
            for(let p in d.provincias) {
                html += `<tr><td>${p.toUpperCase()}</td><td>${d.provincias[p].A}</td><td>${d.provincias[p].B}</td></tr>`;
            }
            document.getElementById('tBody').innerHTML = html;
        }
        setInterval(update, 2000);
    </script>
</body>
</html>
