<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votación Misión Crítica - UMSA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .vote-card { max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
        .candidate-option { border: 2px solid #dee2e6; border-radius: 10px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; }
        .candidate-option:hover { border-color: #007bff; background-color: #f8f9fa; }
        input[type="radio"]:checked + label { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <div class="vote-card">
        <h2 class="text-center mb-4">Emisión de Voto</h2>
        <hr>
        <form id="voteForm">
            <!-- Identificación -->
            <div class="mb-3">
                <label for="voter_id" class="form-label">Cédula de Identidad (CI)</label>
                <input type="text" class="form-control" id="voter_id" name="voter_id" placeholder="Ej: 1234567" required>
            </div>

            <!-- Selección de Elección -->
            <div class="mb-3">
                <label for="eleccion_tipo" class="form-label">Tipo de Elección</label>
                <select class="form-select" id="eleccion_tipo" name="eleccion_tipo" onchange="actualizarCandidatos()">
                    <option value="PRESIDENTE">Presidencial</option>
                    <option value="GOBERNADOR">Gobernador</option>
                </select>
            </div>

            <!-- Candidatos Dinámicos -->
            <div class="mb-4">
                <label class="form-label">Seleccione su Candidato</label>
                <div id="contenedorCandidatos">
                    <!-- Se llena con JavaScript -->
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">Registrar Voto</button>
        </form>
        <div id="responseMessage" class="mt-3"></div>
        <div class="text-center mt-4">
            <a href="/dashboard" class="text-decoration-none">Ver Resultados en Tiempo Real</a>
        </div>
    </div>
</div>

<script>
    const candidatosPorEleccion = {
        "PRESIDENTE": [
            { id: "A", nombre: "Partido A (Alianza)" },
            { id: "B", nombre: "Partido B (Bienestar)" }
        ],
        "GOBERNADOR": [
            { id: "X", nombre: "Partido X (Excelencia)" },
            { id: "Y", nombre: "Partido Y (Unión)" }
        ]
    };

    function actualizarCandidatos() {
        const tipo = document.getElementById('eleccion_tipo').value;
        const contenedor = document.getElementById('contenedorCandidatos');
        contenedor.innerHTML = '';

        candidatosPorEleccion[tipo].forEach(c => {
            contenedor.innerHTML += `
                <div class="form-check candidate-option">
                    <input class="form-check-input" type="radio" name="candidate" id="can${c.id}" value="${c.id}" required>
                    <label class="form-check-label d-block w-100" for="can${c.id}">
                        ${c.nombre}
                    </label>
                </div>
            `;
        });
    }

    // Carga inicial
    actualizarCandidatos();

    document.getElementById('voteForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const responseDiv = document.getElementById('responseMessage');
        
        try {
            const response = await fetch('/votar', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            
            if (response.ok) {
                responseDiv.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                e.target.reset();
                actualizarCandidatos();
            } else {
                responseDiv.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
            }
        } catch (error) {
            responseDiv.innerHTML = `<div class="alert alert-danger">Error de conexión con la infraestructura.</div>`;
        }
    };
</script>

</body>
</html>
