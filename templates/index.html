<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVRE - Sistema de Votación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 2rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .form-control, .form-select { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .form-control:focus, .form-select:focus { background: rgba(255, 255, 255, 0.1); color: white; border-color: #00f2fe; box-shadow: 0 0 10px #00f2fe; }
        .btn-primary { background: linear-gradient(to right, #00c6ff, #0072ff); border: none; font-weight: bold; transition: transform 0.2s; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 198, 255, 0.5); }
        option { background: #203a43; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="glass-card w-100" style="max-width: 450px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold">🗳️ SIVRE Bolivia</h2>
                <p class="text-info small">Sistema de Votación de Misión Crítica</p>
            </div>
            <form id="voteForm">
                <div class="mb-3">
                    <label class="form-label">Cédula de Identidad</label>
                    <input type="text" name="voter_id" class="form-control" placeholder="Ingrese su CI" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de Elección</label>
                    <select id="eleccion_tipo" name="eleccion_tipo" class="form-select">
                        <option value="presidente">Presidente de la República</option>
                        <option value="gobernador">Gobernador Departamental</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Candidato / Partido</label>
                    <select id="candidate" name="candidate" class="form-select">
                        <optgroup label="Presidenciales" id="groupPresi">
                            <option value="A">Partido A (Azul)</option>
                            <option value="B">Partido B (Rojo)</option>
                        </optgroup>
                        <optgroup label="Gobernación" id="groupGober" style="display:none;">
                            <option value="X">Partido X (Verde)</option>
                            <option value="Y">Partido Y (Amarillo)</option>
                        </optgroup>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 mt-3">CONFIRMAR VOTO</button>
            </form>
            <div id="msg" class="mt-4 text-center fw-bold"></div>
        </div>
    </div>
    <script>
        const sel = document.getElementById('eleccion_tipo');
        sel.onchange = () => {
            const isGober = sel.value === 'gobernador';
            document.getElementById('groupPresi').style.display = isGober ? 'none' : 'block';
            document.getElementById('groupGober').style.display = isGober ? 'block' : 'none';
            document.getElementById('candidate').value = isGober ? 'X' : 'A';
        };
        document.getElementById('voteForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/votar', { method: 'POST', body: new FormData(e.target) });
            const d = await res.json();
            const msg = document.getElementById('msg');
            msg.innerText = d.message;
            msg.style.color = d.status === 'success' ? '#00ff88' : '#ff4b2b';
        };
    </script>
</body>
</html>
