<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sufragio UMSA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-lg p-4">
            <h3 class="text-center">Emitir Voto</h3>
            <form id="voteForm">
                <label class="mt-3">Cédula de Identidad:</label>
                <input type="text" name="voter_id" class="form-control" required>

                <label class="mt-3">Tipo de Elección:</label>
                <select id="eleccion_tipo" name="eleccion_tipo" class="form-select">
                    <option value="presidente">Presidente</option>
                    <option value="gobernador">Gobernador</option>
                </select>

                <label class="mt-3">Candidato:</label>
                <select id="candidate" name="candidate" class="form-select">
                    <optgroup label="Presidente" id="groupPresi">
                        <option value="A">Partido A</option>
                        <option value="B">Partido B</option>
                    </optgroup>
                    <optgroup label="Gobernador" id="groupGober" style="display:none;">
                        <option value="X">Partido X</option>
                        <option value="Y">Partido Y</option>
                    </optgroup>
                </select>

                <button type="submit" class="btn btn-primary w-100 mt-4">Registrar Voto</button>
            </form>
            <div id="msg" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        const eTipo = document.getElementById('eleccion_tipo');
        eTipo.onchange = () => {
            const isGober = eTipo.value === 'gobernador';
            document.getElementById('groupPresi').style.display = isGober ? 'none' : 'block';
            document.getElementById('groupGober').style.display = isGober ? 'block' : 'none';
            document.getElementById('candidate').value = isGober ? 'X' : 'A';
        };

        document.getElementById('voteForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/votar', { method: 'POST', body: new FormData(e.target) });
            const data = await res.json();
            document.getElementById('msg').innerText = data.message;
            document.getElementById('msg').className = data.status === 'success' ? 'text-success' : 'text-danger';
        };
    </script>
</body>
</html>
